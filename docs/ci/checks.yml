name: Mobile checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  types-and-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify Android JavaScript bundle
        run: |
          mkdir -p .local/check
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output .local/check/index.android.bundle --assets-dest .local/check/assets --max-workers 2
