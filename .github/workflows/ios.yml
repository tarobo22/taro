name: iOS simulator checks
on:
  push:
    paths: ['ios/**', 'src/**', 'App.tsx', 'index.js', 'package*.json', 'Gemfile*', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'src/**', 'App.tsx', 'index.js', 'package*.json', 'Gemfile*', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - name: Test native rules
        run: |
          mkdir -p .local/ios-proof
          swift test --package-path ios/YeounCore --scratch-path .local/ios-core-build 2>&1 | tee .local/ios-proof/core.log
      - name: Install iOS dependencies
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
          cd ios
          bundle exec pod install
      - name: Build unsigned simulator application
        run: |
          xcodebuild -workspace ios/Yeoun.xcworkspace -scheme Yeoun -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .local/ios-derived -jobs 3 CODE_SIGNING_ALLOWED=NO \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build \
            2>&1 | tee .local/ios-proof/build.log
      - name: Launch on a clean simulator
        run: |
          set -euo pipefail
          proof=.local/ios-proof
          bundle_id=com.yeoun.app
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and ".iOS-" in r["identifier"]))')
          device=$(xcrun simctl create Yeoun-CI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          collect_failure() {
            local result=$?
            if [ "$result" -ne 0 ]; then
              xcrun simctl io "$device" screenshot "$proof/launch-failure.png" || true
              xcrun simctl spawn "$device" log show --last 3m --style compact --info \
                --predicate 'process == "Yeoun" OR ((process == "SpringBoard" OR process == "runningboardd") AND eventMessage CONTAINS "com.yeoun.app")' \
                > "$proof/runtime.log" 2>&1 || true
              for report in "$HOME"/Library/Logs/DiagnosticReports/Yeoun*.ips; do
                if [[ -f "$report" && "$report" -nt "$proof/launch.log" ]]; then
                  cp "$report" "$proof/" || true
                fi
              done
              xcrun simctl shutdown "$device" || true
            fi
            exit "$result"
          }
          trap collect_failure EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" .local/ios-derived/Build/Products/Release-iphonesimulator/Yeoun.app
          installed_app=$(xcrun simctl get_app_container "$device" "$bundle_id" app)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$installed_app/Info.plist")
          launch=$(xcrun simctl launch "$device" "$bundle_id" | tee "$proof/launch.log")
          if [[ ! "$launch" =~ ^com\.yeoun\.app:[[:space:]]+([1-9][0-9]*)$ ]]; then
            echo "::error::simctl did not return a valid Yeoun PID"
            exit 1
          fi
          pid="${BASH_REMATCH[1]}"
          sleep 5
          if ! process=$(ps -ww -p "$pid" -o state= -o command=); then
            echo "::error::Yeoun PID $pid exited before the five-second check"
            exit 1
          fi
          printf '%s\n' "$process" > "$proof/process.log"
          python3 - "$installed_app/$executable" "$process" <<'PY'
          import os
          import sys
          expected = os.path.realpath(sys.argv[1])
          state, command = sys.argv[2].split(maxsplit=1)
          # A simulator executable has a full path, which may contain spaces.
          candidates = [command, *[command[:i] for i, c in enumerate(command) if c == " "]]
          if state[0] in "ZX" or not any(os.path.realpath(path) == expected for path in candidates):
              sys.exit("The returned PID is not the live installed Yeoun executable")
          PY
          xcrun simctl io "$device" screenshot "$proof/launch.png"
          xcrun simctl openurl "$device" 'yeoun://auth/complete'
          xcrun simctl shutdown "$device"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ios-simulator-proof
          path: .local/ios-proof
